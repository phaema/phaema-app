# Dependabot proposes updates as pull requests; nothing merges without review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # CodeQL's init and analyze steps must stay on the same version, so they update in one pull request.
      codeql:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
