name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: phaema
          POSTGRES_USER: phaema
          POSTGRES_PASSWORD: phaema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phaema" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgis://phaema:phaema@localhost:5432/phaema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
