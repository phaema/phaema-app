name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code. Nothing here can write to the repository.
# Actions are pinned to a commit hash (the version in the comment); Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: phaema
          POSTGRES_USER: phaema
          POSTGRES_PASSWORD: phaema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U phaema" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgis://phaema:phaema@localhost:5432/phaema
      # A throwaway key for the tests only (PHAEMA refuses to start without a long one).
      SECRET_KEY: ci-only-not-secret-0000000000000000000000000000000000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin tesseract-ocr tesseract-ocr-eng
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level ERROR
        env:
          DEBUG: "False"
          SECURE_COOKIES: "True"
      - run: pip install pytest-cov
      # COVERAGE_CORE=sysmon keeps the coverage overhead small on Python 3.12 and later.
      - run: python -m pytest --cov=apps --cov-report=term:skip-covered --cov-fail-under="$COVERAGE_MINIMUM"
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_MINIMUM: "90"  # measured 95% on 26 November 2026

  # Style and common mistakes (Ruff, configured in ruff.toml).
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15,<1"
      - run: ruff check --output-format github .

  # Known vulnerabilities in the Python packages PHAEMA uses.
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit --requirement requirements.txt --progress-spinner off

  # The application image still builds (the Dockerfile is what councils and the demo server run).
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - run: docker build --tag phaema:ci .
      - run: docker build --tag phaema-db:ci docker/db
