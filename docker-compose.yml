# Runs PHAEMA locally (e.g. on a Mac) or on a single server.
# Start with:  ./phaema.sh start      then open http://localhost:8000
services:
  db:
    build: ./docker/db
    environment:
      POSTGRES_DB: phaema
      POSTGRES_USER: phaema
      POSTGRES_PASSWORD: ${DB_PASSWORD:-phaema-local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phaema -d phaema"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgis://phaema:${DB_PASSWORD:-phaema-local}@db:5432/phaema
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      DEBUG: ${DEBUG:-False}
      SECURE_COOKIES: ${SECURE_COOKIES:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      BEHIND_HTTPS_PROXY: ${BEHIND_HTTPS_PROXY:-False}
      PHAEMA_ORGANISATION_NAME: ${PHAEMA_ORGANISATION_NAME:-Demonstration Council}
      PHAEMA_BASE_URL: ${PHAEMA_BASE_URL:-http://localhost:8000}
      PHAEMA_DEMO_SITE: ${PHAEMA_DEMO_SITE:-False}
      PHAEMA_DEMO_RESET_HOURS: ${PHAEMA_DEMO_RESET_HOURS:-48}
      PHAEMA_ACCOUNT_REQUEST_EMAIL: ${PHAEMA_ACCOUNT_REQUEST_EMAIL:-}
      PHAEMA_SSO_ISSUER: ${PHAEMA_SSO_ISSUER:-}
      PHAEMA_SSO_CLIENT_ID: ${PHAEMA_SSO_CLIENT_ID:-}
      PHAEMA_SSO_CLIENT_SECRET: ${PHAEMA_SSO_CLIENT_SECRET:-}
      PHAEMA_SSO_NAME: ${PHAEMA_SSO_NAME:-Microsoft}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-PHAEMA <phaema@localhost>}
      MEDIA_ROOT: /app/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/app/media
    restart: unless-stopped

  # Runs daily housekeeping every hour: stepped rents, lease events and reminder emails.
  scheduler:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgis://phaema:${DB_PASSWORD:-phaema-local}@db:5432/phaema
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      PHAEMA_BASE_URL: ${PHAEMA_BASE_URL:-http://localhost:8000}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-PHAEMA <phaema@localhost>}
      MEDIA_ROOT: /app/media
    command: ["sh", "-c", "sleep 60; while true; do python manage.py daily_tasks; sleep 3600; done"]
    volumes:
      - media:/app/media
    restart: unless-stopped

volumes:
  db-data:
  media:
