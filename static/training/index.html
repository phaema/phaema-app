<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHAEMA Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: a course player. Home lists roles; a role lists modules; a module plays walkthrough steps, an exercise
   on the demonstration data, then a short quiz. Highlights use the red "edged on the plan" line of the PHAEMA brand. */
:root {
  --paper: #f6f8f7; --sheet: #ffffff; --ink: #13233a; --muted: #4a5864; --line: #cfd6d8; --edge: #d42a25;
  --survey: #2c6a3e; --survey-tint: #e3efe6; --link: #1b5c89; --warn-tint: #fbe9e7; --focus: #ffdd00; --band: #0d1b2c;
  --on-survey: #ffffff;
  --display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0e151d; --sheet: #15202b; --ink: #e6ecef; --muted: #a9b5be; --line: #2d3b48; --edge: #ff6f69;
  --survey: #7fc78f; --survey-tint: #1d3326; --link: #86bfe9; --warn-tint: #3a1f1d; --on-survey: #0e151d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0e151d; --sheet: #15202b; --ink: #e6ecef; --muted: #a9b5be; --line: #2d3b48; --edge: #ff6f69;
  --survey: #7fc78f; --survey-tint: #1d3326; --link: #86bfe9; --warn-tint: #3a1f1d; --on-survey: #0e151d; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1.0625rem/1.55 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); line-height: 1.1; text-wrap: balance; margin: 0 0 .4em; }
h1 { font-size: clamp(2rem, 4.5vw, 3.2rem); font-weight: 800; letter-spacing: -.015em; }
h2 { font-size: clamp(1.4rem, 2.6vw, 1.9rem); font-weight: 800; }
h3 { font-size: 1.2rem; font-weight: 600; }
p { margin: 0 0 1em; max-width: 68ch; }
a { color: var(--link); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; box-shadow: 0 0 0 6px #0b0c0c; }
.top { background: var(--band); color: #f1f5f3; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.top__inner { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; padding-block: 14px; }
.brand { color: #f1f5f3; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 1.3rem; letter-spacing: .12em; display: inline-flex; gap: 10px; align-items: center; }
.brand small { font-family: var(--body); letter-spacing: 0; font-weight: 400; font-size: 1rem; color: #b9c6cf; }
.brand i { width: 18px; height: 14px; border: 2.5px solid #ff5b4f; display: inline-block; }
.crumbs { font-size: .95rem; color: #b9c6cf; }
.crumbs a { color: #9fd0f5; }
main { padding-block: 32px 64px; }
.lede { font-size: 1.2rem; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 11px 18px; font-weight: 700; border-radius: 3px; text-decoration: none; }
.btn--go { background: var(--survey); color: var(--on-survey); box-shadow: 0 3px 0 rgba(0,0,0,.35); }
.btn--plain { background: transparent; color: var(--link); box-shadow: inset 0 0 0 2px var(--link); }
.btn[disabled] { opacity: .45; cursor: default; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--survey); border-radius: 99px; }

/* Home: roles */
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-top: 24px; }
.role { background: var(--sheet); border: 1px solid var(--line); padding: 22px; display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: var(--ink); position: relative; }
.role:hover { border-color: var(--ink); }
.role h2 { font-size: 1.45rem; margin: 0; }
.role p { margin: 0; color: var(--muted); font-size: 1rem; }
.role__meta { display: flex; justify-content: space-between; font-size: .95rem; color: var(--muted); margin-top: auto; padding-top: 10px; }
.role__done { position: absolute; top: 14px; right: 14px; font-size: .85rem; font-weight: 700; color: var(--survey); border: 2px solid var(--survey); padding: 1px 8px; }

/* Course: modules */
.modules { list-style: none; padding: 0; margin: 24px 0; display: grid; gap: 10px; }
.mod { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--sheet); border: 1px solid var(--line); padding: 16px 18px; }
.mod__n { width: 44px; height: 44px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1.2rem; border: 2px solid var(--line); border-radius: 50%; }
.mod.done .mod__n { background: var(--survey); color: var(--on-survey); border-color: var(--survey); }
.mod h3 { margin: 0 0 2px; }
.mod p { margin: 0; color: var(--muted); font-size: .98rem; }
.mod__state { font-size: .9rem; color: var(--muted); text-align: right; display: grid; gap: 6px; justify-items: end; }

/* Player */
.player { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(280px, 1fr); gap: 28px; align-items: start; margin-top: 20px; }
.shot { position: relative; overflow: hidden; background: var(--sheet); border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(13,27,44,.16); }
.shot img { display: block; width: 100%; height: auto; }
.hl { position: absolute; border: 3px solid var(--edge); box-shadow: 0 0 0 9999px rgba(13,27,44,.42); border-radius: 2px; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .hl { transition: all .45s cubic-bezier(.2,.7,.2,1); } .hl.pulse { animation: pulse 1.6s ease-out 1; } }
@keyframes pulse { 0% { outline: 0 solid rgba(212,42,37,.55); } 100% { outline: 14px solid rgba(212,42,37,0); } }
.panel { background: var(--sheet); border: 1px solid var(--line); padding: 22px; position: sticky; top: 16px; }
.phase { font-size: .9rem; color: var(--muted); margin-bottom: 6px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 18px; }
.dots button { width: 28px; height: 8px; border: 0; padding: 0; background: var(--line); border-radius: 99px; }
.dots button.seen { background: var(--muted); }
.dots button[aria-current="step"] { background: var(--edge); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.choices { display: grid; gap: 8px; margin: 14px 0; padding: 0; border: 0; }
.choices legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 2px solid var(--line); padding: 10px 12px; background: var(--paper); cursor: pointer; }
.choice input { margin-top: 4px; accent-color: var(--survey); width: 18px; height: 18px; flex: none; }
.choice.right { border-color: var(--survey); background: var(--survey-tint); }
.choice.wrong { border-color: var(--edge); background: var(--warn-tint); }
.feedback { border-left: 4px solid var(--survey); padding: 8px 12px; background: var(--survey-tint); margin: 10px 0; }
.feedback.no { border-color: var(--edge); background: var(--warn-tint); }
.hint { font-size: .95rem; color: var(--muted); }
.result { text-align: left; background: var(--sheet); border: 1px solid var(--line); padding: 28px; margin-top: 20px; }
.score { font-family: var(--display); font-weight: 800; font-size: 3.4rem; line-height: 1; color: var(--survey); }
.trythis { background: var(--band); color: #f1f5f3; padding: 22px; margin-bottom: 18px; }
.trythis h3 { color: #fff; }
.trythis p { color: #dbe4ea; }
.foot { color: var(--muted); font-size: .9rem; padding-block: 24px 40px; border-top: 1px solid var(--line); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; }
@media (max-width: 860px) {
  .player { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; }
  .mod { grid-template-columns: 36px minmax(0, 1fr); }
  .mod__state { grid-column: 2; justify-items: start; text-align: left; }
}
</style>
<style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}</style>
</head>

gs that are overdue for you?", "options": ["My work, Needs attention now", "Reports", "Changes", "Manage data"], "answer": 0, "why": "My work lists everything overdue or waiting for you, oldest first."}, {"q": "You hide a section on the dashboard. What happens next time you open PHAEMA on the same computer?", "options": ["It stays hidden", "It reappears", "It is deleted for everyone"], "answer": 0, "why": "Hidden sections are remembered on that computer only, and still print."}, {"q": "How do you make all text in PHAEMA larger?", "options": ["Text size, under the menu", "Ask an administrator", "It cannot be changed"], "answer": 0, "why": "Text size is a personal setting under the menu; browser zoom also works."}]}, {"id": "properties", "title": "Properties and the register", "minutes": 15, "intro": "Find a property, read its record and see how estates, buildings and units fit together.", "steps": [{"img": "img/properties-1.jpg", "box": [0.0266, 0.2263, 0.2262, 0.7738], "title": "Search and filter", "text": "Search by reference, name, address, postcode, UPRN or title number, then narrow by type, purpose, occupation, tenure or surveyor."}, {"img": "img/properties-2.jpg", "box": [0.0266, 0.2838, 0.9469, 0.0775], "title": "The property record", "text": "Each property has its reference, key facts, photos, location and the managing surveyor responsible for it."}, {"img": "img/properties-3.jpg", "box": [0.0266, 0.6925, 0.6266, 0.065], "title": "Parts of a property", "text": "Estates contain sites, buildings and units. A surveyor who manages an estate also manages everything within it."}, {"img": "img/properties-4.jpg", "box": [0.0266, 0.4113, 0.3391, 0.0413], "title": "Making changes", "text": "Surveyors can edit the properties they manage: add photos, correct details or record site hazards. Every change is logged."}], "exercise": {"q": "Open DM-N01 Northfield Business Park. Who is its managing surveyor?", "options": ["Lena Chen", "Rob Baker", "Alex Morgan", "Owen Jones"], "answer": 0, "hint": "The managing surveyor is in the key facts near the top."}, "quiz": [{"q": "A unit is part of a building on an estate you manage. Who manages the unit?", "options": ["You", "Nobody until assigned", "The administrator"], "answer": 0, "why": "Parts follow the surveyor of the estate or building they belong to."}, {"q": "Which identifier links a property to GIS, council tax and business rates?", "options": ["UPRN", "Title number", "Case reference"], "answer": 0, "why": "The Unique Property Reference Number is the national key."}, {"q": "Where do you record that a roof is fragile, so visitors are warned?", "options": ["Site hazards on the property", "A note on a lease", "The change log"], "answer": 0, "why": "Site hazards appear in the Before you visit panel on cases, jobs and valuations."}]}, {"id": "leases", "title": "Leases and key dates", "minutes": 20, "intro": "Read an agreement, see its events and record the outcome of a rent review.", "steps": [{"img": "img/leases-1.jpg", "box": [0.0266, 0.2838, 0.9469, 0.0775], "title": "The agreement", "text": "Each lease or licence shows the tenant, premises, term, rent, deposit, repairing terms and its events."}, {"img": "img/leases-2.jpg", "box": [0.0266, 0.465, 0.6266, 0.0525], "title": "Key dates become events", "text": "Rent reviews, breaks, break notice deadlines and expiries are created from the lease and assigned to the managing surveyor."}, {"img": "img/leases-3.jpg", "box": [0.0266, 0.1512, 0.2262, 0.8488], "title": "Your events", "text": "Lease events lists everything due. Filter to your own, to overdue events, or to a type of event."}, {"img": "img/leases-4.jpg", "box": [0.0266, 0.915, 0.6266, 0.0525], "title": "Recording a review", "text": "Record the agreed rent and date. PHAEMA adds the new rent to the schedule and sets up the next review. If a case needs approval, this waits until it is approved."}], "exercise": {"q": "Open DL-0502 Northfield Packaging Ltd. What is the current rent a year? e renewal case for Unit 7 Northfield Business Park. On which ground does the council oppose a new tenancy?", "options": ["Section 30(1)(f): redevelopment", "Section 30(1)(a): disrepair", "Section 30(1)(b): arrears", "It does not oppose"], "answer": 0, "hint": "Look under 1954 Act notices."}, "quiz": [{"q": "The tenant is not professionally represented. What must you record before the decision?", "options": ["The date the RICS Code was given to them", "Their solicitor's name", "Nothing"], "answer": 0, "why": "The Code requires unrepresented tenants to be given it, with advice to get help."}, {"q": "What does PHAEMA calculate from a section 26 request?", "options": ["Counter-notice date and court deadline", "The new rent", "The dilapidations figure"], "answer": 0, "why": "It works out the statutory dates from the date served and the date in the request."}, {"q": "A new letting of a unit with an EPC rated G. What does PHAEMA do?", "options": ["Shows a MEES warning", "Refuses to open the case", "Nothing"], "answer": 0, "why": "Lettings below band E need an exemption; PHAEMA warns but does not block."}]}, {"id": "letters", "title": "Letters and notices", "minutes": 10, "intro": "Create a filled-in letter from a case and finish it in Word.", "steps": [{"img": "img/letters-1.jpg", "box": [0.0461, 0.5794, 0.1645, 0.0413], "title": "From the case", "text": "Open Create a letter or notice on any case to see the templates that suit it."}, {"img": "img/letters-2.jpg", "box": [0.3469, 0.1875, 0.6266, 0.8125], "title": "Check the preview", "text": "PHAEMA fills in the tenant, premises, lease and case details. Anything it could not fill is highlighted for you to complete."}, {"img": "img/letters-3.jpg", "box": [0.0266, 0.1837, 0.9469, 0.0775], "title": "The document library", "text": "All 30 templates are in the Document library, grouped by subject. Administrators can add the council's own."}], "exercise": {"q": "You need a landlord's section 25 notice. What does PHAEMA give you?" link in its heading. PHAEMA remembers what you hide on that computer. Hide all and Show all do every section at once."}, {"img": "img/start-5.jpg", "box": [0.0266, 0.1338, 0.9469, 0.09], "title": "Style, theme and text size", "text": "Under the menu you can change the style (Classic, Clear or Compact), the colours (Dark, High contrast) and the text size. Help with this page opens the manual at the right place."}], "exercise": {"q": "Open the Whole estate dashboard. Which section shows the WAULT (weighted average unexpired lease term)?", "options": ["Rent roll", "Vacant floor space", "Lease events", "Register by type"], "answer": 0, "hint": "Look for the section with the rent figures."}, "quiz": [{"q": "Where do you see the things that are overdue for you?", "options": ["My work, Needs attention now", "Reports", "Changes", "Manage data"], "answer": 0, "why": "My work lists everything overdue or waiting for you, oldest first."}, {"q": "You hide a section on the dashboard. What happens next time you open PHAEMA on the same computer?", "options": ["It stays hidden", "It reappears", "It is deleted for everyone"], "answer": 0, "why": "Hidden sections are remembered on that computer only, and still print."}, {"q": "How do you make all text in PHAEMA larger?", "options": ["Text size, under the menu", "Ask an administrator", "It cannot be changed"], "answer": 0, "why": "Text size is a personal setting under the menu; browser zoom also works."}]}, {"id": "rents", "title": "Rents and arrears", "minutes": 20, "intro": "Raise rent, read a tenant's account, credit a charge and chase arrears.", "steps": [{"img": "img/rents-1.jpg", "box": [0.0266, 0.5475, 0.4664, 0.0525], "title": "The rents overview", "text": "Collection rate, arrears by age and the latest demand runs. Charges not yet sent to finance are counted here."}, {"img": "img/rents-2.jpg", "box": [0.2186, 0.3088, 0.0663, 0.0375], "title": "Raising rent", "text": "A demand run raises every charge due in a period, once only, with VAT where it applies. Service charge on-account demands are included."}, {"img": "img/rents-3.jpg", "box": [0.0266, 0.4338, 0.9469, 0.5663], "title": "Arrears", "text": "Every agreement with overdue rent, aged into 1 to 30, 31 to 60, 61 to 90 and over 90 days."}, {"img": "img/rents-4.jpg", "box": [0.0266, 0.0925, 0.9469, 0.9075], "title": "A tenant's account", "text": "Charges and receipts with a running balance. Payments are set against the oldest amounts first. Credit a charge here, with a reason."}], "exercise": {"q": "Open the rent account for DL-0506 Northfield Joinery Workshop. How many monthly charges are unpaid?", "options": ["2", "1", "4", "None"], "answer": 0, "hint": "Look at the most recent charges in the account."}, "quiz": [{"q": "You run the same demand run twice. What happens?", "options": ["Charges are only raised once", "Every tenant is charged twice", "PHAEMA crashes"], "answer": 0, "why": "Demand runs never charge the same period twice."}, {"q": "How do receipts get into PHAEMA?", "options": ["Imported from the finance system", "Typed by tenants", "They are not recorded"], "answer": 0, "why": "Receipts are imported and matched to invoices."}, {"q": "What must every credit note have?", "options": ["A reason", "A supervisor's signature", "A new invoice"], "answer": 0, "why": "Credits are refused without a reason."}]}, {"id": "service", "title": "Service charges", "minutes": 25, "intro": "Shares, budgets, actual costs, the year end and the RICS timetable.", "steps": [{"img": "img/service-1.jpg", "box": [0.0266, 0.4838, 0.9469, 0.065], "title": "Shares", "text": "Each lease's share of the schedule, by floor area. Empty units are borne by the council, and caps limit what a tenant pays."}, {"img": "img/service-2.jpg", "box": [0.0266, 0.5675, 0.9469, 0.0525], "title": "The RICS timetable", "text": "Budgets go to tenants at least a month before the year, and statements within four months of the year end. A late issue needs a reason, which tenants see."}, {"img": "img/service-3.jpg", "box": [0.0266, 0.0925, 0.9469, 0.9075], "title": "The apportionment matrix", "text": "Every heading split across every lease, ready to download for checking."}, {"img": "img/service-4.jpg", "box": [0.4979, 0.5687, 0.1511, 0.0625], "title": "Year end", "text": "Reconciling compares actual costs with on-account demands and produces each tenant's balancing charge or credit."}], "exercise": {"q": "Open the Northfield Business Park services schedule. What is the annual cap for DL-0509 Northfield Training Services?", "options": ["\u00a31,800", "\u00a32,900", "No cap", "\u00a34,200"], "answer": 0, "hint": "Caps are shown against each lease in Shares."}, "quiz": [{"q": "An improvement is marked recoverable without tenants' agreement. What happens?", "options": ["PHAEMA refuses it", "It is charged to tenants", "It is deleted"], "answer": 0, "why": "Improvements are recoverable only when tenants agreed."}, {"q": "A cost is a Building Safety Act defect. Who pays?", "options": ["The council: never recoverable", "The tenants", "The contractor"], "answer": 0, "why": "Remediation of relevant defects is protected from leaseholders."}, {"q": "Statements are issued after the deadline. What must you record?", "options": ["The reason, shown to tenants", "Nothing", "A penalty"], "answer": 0, "why": "The RICS standard expects tenants to be told why."}]}, {"id": "valuation", "title": "Valuations for the accounts", "minutes": 20, "intro": "The valuation programme, accepting values for the accounts and answering the auditor.", "steps": [{"img": "img/valuation-1.jpg", "box": [0.0266, 0.4338, 0.9469, 0.065], "title": "The programme", "text": "Every classified asset due for valuation this year, with who it is assigned to and its progress."}, {"img": "img/valuation-2.jpg", "box": [0.0266, 0.5169, 0.6266, 0.1787], "title": "Assignment", "text": "Each valuation is assigned to a member of staff or an external valuer, who is emailed."}, {"img": "img/valuation-3.jpg", "box": [0.6672, 0.5775, 0.3063, 0.0587], "title": "Accepting", "text": "Administrators accept a valuation once the figures, fair value level and report are complete. Accepted valuations are locked."}, {"img": "img/valuation-4.jpg", "box": [0.0266, 0.5737, 0.6266, 0.0525], "title": "Audit queries", "text": "Flag a valuation for audit with the auditor's query, record the response sent, then close it off with the outcome."}], "exercise": {"q": "Which Northfield asset has an audit query waiting for a response?", "options": ["Northfield Market Hall", "Northfield Library", "Hilltop Farm", "Kingsway car park"], "answer": 0, "hint": "Asset valuation, Audit."}, "quiz": [{"q": "What must be recorded for a fair value valuation before acceptance?", "options": ["The fair value hierarchy level", "The tenant's name", "Nothing extra"], "answer": 0, "why": "IFRS 13 disclosures need the level."}, {"q": "Between full valuations, how does PHAEMA estimate current value?", "options": ["Indexation using the class's index", "It does not", "The tenant's rent"], "answer": 0, "why": "Index values bring the last valuation forward to the year end."}, {"q": "Who can accept a valuation for the accounts?", "options": ["Administrators", "Any surveyor", "The valuer"], "answer": 0, "why": "Acceptance is an administrator's control."}]}, {"id": "reports", "title": "Reports and exports", "minutes": 15, "intro": "Run, build and download reports, and send charges to the finance system.", "steps": [{"img": "img/reports-1.jpg", "box": [0.0266, 0.49, 0.9469, 0.065], "title": "Ready-made reports", "text": "Dozens of reports grouped by topic, from the rent roll to arrears and service charge deadlines."}, {"img": "img/reports-2.jpg", "box": [0.0266, 0.515, 0.1346, 0.0625], "title": "Downloading", "text": "Every report downloads to Excel or CSV with every row, not just the first page."}, {"img": "img/reports-3.jpg", "box": [0.0266, 0.365, 0.1511, 0.0625], "title": "Your own reports", "text": "Choose the records, columns, filters and sort order, then save and share with colleagues."}, {"img": "img/reports-4.jpg", "box": [0.3895, 0.3088, 0.0983, 0.0375], "title": "Finance exports", "text": "Charges and credit notes not yet sent go into an export file for the finance system. Exported charges are locked."}], "exercise": {"q": "Which ready-made report produces the Transparency Code land and assets list?", "options": ["Land and building assets (Transparency Code)", "Rent roll", "Property terrier", "Vacant properties"], "answer": 0, "hint": "Property and assets section of Reports."}, "quiz": [{"q": "A report filter says 'in the next 90 days'. Next month, the report shows\u2026", "options": ["The next 90 days from then", "The same dates as before", "Nothing"], "answer": 0, "why": "Relative date filters move with time."}, {"q": "Can colleagues change a report you shared?", "options": ["No, but they can copy it", "Yes", "Only viewers can"], "answer": 0, "why": "Only you and administrators can change it."}, {"q": "What happens to a charge once exported to finance?", "options": ["It is locked", "It is deleted", "It is sent again next time"], "answer": 0, "why": "Each charge goes to finance once."}]}]}, {"id": "buildings", "title": "Maintenance and compliance", "who": "Building surveyors, facilities and compliance officers.", "modules": [{"id": "start", "title": "Getting around PHAEMA", "minutes": 10, "intro": "Find your way round: the menu, your dashboard, the page settings and the help.", "steps": [{"img": "img/start-1.jpg", "box": [0.0266, 0.055, 0.9469, 0.0663], "title": "The menu", "text": "Every area of PHAEMA is in the menu at the top. Income and Buildings open a short list of their own pages. Menu items you do not have access to are not shown."}, {"img": "img/start-2.jpg", "box": [0.0266, 0.3088, 0.9469, 0.0675], "title": "Two dashboards", "text": "My work shows your own work; Whole estate shows the figures for the whole council. Surveyors start on My work. PHAEMA remembers the tab you last chose."}, {"img": "img/start-3.jpg", "box": [0.0266, 0.2512, 0.6266, 0.7488], "title": "Needs attention now", "text": "Anything overdue or waiting for you, oldest first: lease events, case targets and tasks, approvals, repairs, certificates and audit queries. Every line links to the record."}, {"img": "img/start-4.jpg", "box": [0.0266, 0.5725, 0.6266, 0.0525], "title": "Hide and show sections", "text": "Each section has a Hide link in its heading. PHAEMA remembers what you hide on that computer. Hide all and Show all do every section at once."}, {"img": "img/start-5.jpg", "box": [0.0266, 0.1338, 0.9469, 0.09], "title": "Style, theme and text size", "text": "Under the menu you can change the style (Classic, Clear or Compact), the colours (Dark, High contrast) and the text size. Help with this page opens the manual at the right place."}], "exercise": {"q": "Open the Whole estate dashboard. Which section shows the WAULT (weighted average unexpired lease term)?", "options": ["Rent roll", "Vacant floor space", "Lease events", "Register by type"], "answer": 0, "hint": "Look for the section with the rent figures."}, "quiz": [{"q": "Where do you see the things that are overdue for you?", "options": ["My work, Needs attention now", "Reports", "Changes", "Manage data"], "answer": 0, "why": "My work lists everything overdue or waiting for you, oldest first."}, {"q": "You hide a section on the dashboard. What happens next time you open PHAEMA on the same computer?", "options": ["It stays hidden", "It reappears", "It is deleted for everyone"], "answer": 0, "why": "Hidden sections are remembered on that computer only, and still print."}, {"q": "How do you make all text in PHAEMA larger?", "options": ["Text size, under the menu", "Ask an administrator", "It cannot be changed"], "answer": 0, "why": "Text size is a personal setting under the menu; browser zoom also works."}]}, {"id": "repairs", "title": "Repairs and works orders", "minutes": 20, "intro": "Report a repair, decide who pays, order the work and complete it.", "steps": [{"img": "img/repairs-1.jpg", "box": [0.0266, 0.345, 0.1271, 0.0625], "title": "Reporting a repair", "text": "Choose the property and priority. The target date is set from the priority, and PHAEMA suggests who pays from the lease."}, {"img": "img/repairs-2.jpg", "box": [0.0266, 0.5088, 0.6266, 0.065], "title": "Who pays", "text": "Council, service charge, recharge to the tenant or the tenant's own repair, with the reason."}, {"img": "img/repairs-3.jpg", "box": [0.6867, 0.4575, 0.224, 0.0413], "title": "Before you visit", "text": "Site hazards, asbestos information and open compliance actions for the property and its building."}, {"img": "img/repairs-4.jpg", "box": [0.0266, 0.5737, 0.6266, 0.0525], "title": "The works order", "text": "Choose the contractor, estimate and purchase order number, then issue the order. Larger orders need your supervisor's approval."}, {"img": "img/repairs-5.jpg", "box": [0.0461, 0.5175, 0.5875, 0.0462], "title": "Approving an order", "text": "Your supervisor approves the order or returns it with comments."}], "exercise": {"q": "The shop front window at 6 The Precinct is cracked. Who pays for the repair?", "options": ["The tenant", "The council", "The service charge", "The contractor"], "answer": 0, "hint": "Open the job and look at Who pays."}, "quiz": [{"q": "What sets a repair's target date?", "options": ["Its priority", "The contractor", "The tenant"], "answer": 0, "why": "Emergency, urgent and routine each have target times."}, {"q": "A tenant damaged a door. How do you recover the cost?", "options": ["Mark it recharge; a recharge invoice is raised on completion", "Add it to the service charge", "You cannot"], "answer": 0, "why": "Recharges go to the tenant's rent account."}, {"q": "Where are site hazards shown?", "options": ["Before you visit, on jobs, cases and valuations", "Only on the map", "Nowhere"], "answer": 0, "why": "So nobody visits unaware."}]}, {"id": "planned", "title": "Planned maintenance and components", "minutes": 15, "intro": "Statutory and planned tasks, and the components that make up each building.", "steps": [{"img": "img/planned-1.jpg", "box": [0.0266, 0.395, 0.9469, 0.1575], "title": "Planned maintenance", "text": "Statutory and planned tasks with their frequency and next due date. A job is raised automatically when a task falls due."}, {"img": "img/planned-2.jpg", "box": [0.0266, 0.345, 0.9469, 0.1275], "title": "Components", "text": "Roofs, boilers, lifts and other components with condition, expected life and replacement cost, for the capital programme."}], "exercise": {"q": "What condition grade is the flat roof at Northfield Library?", "options": ["D", "A", "B", "C"], "answer": 0, "hint": "Components, filtered to DM-N03."}, "quiz": [{"q": "A statutory task falls due. What does PHAEMA do?", "options": ["Raises a job automatically", "Nothing", "Deletes the task"], "answer": 0, "why": "Due tasks become jobs so nothing is missed."}, {"q": "Which components feed the capital programme report?", "options": ["Those in condition C or D", "Only new ones", "None"], "answer": 0, "why": "Poor and bad condition components are reported."}, {"q": "You complete a job raised from a planned task. What happens to the task?", "options": ["It is marked done and its next date is set", "Nothing", "It is deleted"], "answer": 0, "why": "Completing the job records the task as done."}]}, {"id": "compliance", "title": "Compliance and the Golden Thread", "minutes": 25, "intro": "Certificates, remedial actions, building safety tiers and building information.", "steps": [{"img": "img/compliance-1.jpg", "box": [0.0266, 0.1837, 0.9469, 0.0775], "title": "The register", "text": "Every required certificate on every building, worst first: missing, expired, unsatisfactory, expiring soon."}, {"img": "img/compliance-2.jpg", "box": [0.0266, 0.4275, 0.9469, 0.065], "title": "A building's certificates", "text": "Record a new certificate with its date and result. The expiry is worked out from the usual period."}, {"img": "img/compliance-3.jpg", "box": [0.0266, 0.5737, 0.9469, 0.0525], "title": "Remedial actions", "text": "Actions from a certificate, with priority and due date. Raise a repair job straight from an action."}, {"img": "img/compliance-4.jpg", "box": [0.0266, 0.5737, 0.9469, 0.0525], "title": "Golden Thread tier", "text": "Screen the building's height, storeys and homes, and confirm its tier and responsible person."}, {"img": "img/compliance-5.jpg", "box": [0.0266, 0.5737, 0.9469, 0.0525], "title": "Building information", "text": "Plans, fire strategy, asbestos register and manuals. A new version supersedes the old one, which stays in the history."}], "exercise": {"q": "Which certificate is missing at DM-N04 Northfield Leisure Centre?", "options": ["Air conditioning inspection (TM44)", "Gas safety", "Fire risk assessment", "EPC"], "answer": 0, "hint": "Compliance, then the leisure centre."}, "quiz": [{"q": "You upload a new asbestos register. What happens to the old one?", "options": ["Kept as a superseded version", "Deleted", "Overwritten"], "answer": 0, "why": "The Golden Thread keeps the history."}, {"q": "A certificate's result is Unsatisfactory. How is it shown?", "options": ["Red, near the top of the register", "Green", "Hidden"], "answer": 0, "why": "Problems sort first."}, {"q": "What does tier A mean?", "options": ["A higher-risk or in-scope building: statutory Golden Thread", "Best practice only", "Land with no buildings"], "answer": 0, "why": "Tier A carries the statutory duties."}]}]}, {"id": "admin", "title": "System administrator", "who": "Administrators who set PHAEMA up, manage users and bring data in.", "modules": [{"id": "start", "title": "Getting around PHAEMA", "minutes": 10, "intro": "Find your way round: the menu, your dashboard, the page settings and the help.", "steps": [{"img": "img/start-1.jpg", "box": [0.0266, 0.055, 0.9469, 0.0663], "title": "The menu", "text": "E (function () {
  var app = document.getElementById('app'), crumbs = document.getElementById('crumbs');
  var KEY = 'phaema_training_v1', state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { state = {}; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function course(id) { return COURSES.filter(function (c) { return c.id === id; })[0]; }
  function done(mid) { return state[mid] && state[mid].done; }
  function mins(c) { return c.modules.reduce(function (a, m) { return a + m.minutes; }, 0); }
  function doneCount(c) { return c.modules.filter(function (m) { return done(m.id); }).length; }

  function home() {
    crumbs.innerHTML = '';
    var cards = COURSES.map(function (c) {
      var n = doneCount(c), t = c.modules.length;
      return '<a class="role" href="#' + c.id + '">' + (n === t ? '<span class="role__done">Complete</span>' : '') +
        '<h2>' + esc(c.title) + '</h2><p>' + esc(c.who) + '</p>' +
        '<div class="bar" aria-hidden="true"><span style="width:' + Math.round(100 * n / t) + '%"></span></div>' +
        '<div class="role__meta"><span>' + t + ' modules, about ' + Math.round(mins(c) / 5) * 5 + ' minutes</span><span>' + n + ' of ' + t + ' done</span></div></a>';
    }).join('');
    app.innerHTML = '<h1>Learn PHAEMA for your job</h1><p class="lede">Choose your role. Each course walks you through the real screens, then you try it on the demonstration data and check what you have learnt with a short quiz.</p>' +
      '<div class="roles">' + cards + '</div>' +
      '<h2 style="margin-top:40px">Before you start</h2><ol><li>Ask your administrator for a sign-in to the training copy of PHAEMA, loaded with the demonstration data.</li><li>Open it in another window beside this one, so you can follow along.</li><li>Every course starts with Getting around PHAEMA. If you have done it in another course, it is already ticked.</li></ol>';
  }

  function courseView(c) {
    crumbs.innerHTML = '<a href="#home">All courses</a> / ' + esc(c.title);
    var list = c.modules.map(function (m, i) {
      var s = state[m.id] || {};
      return '<li class="mod' + (s.done ? ' done' : '') + '"><span class="mod__n" aria-hidden="true">' + (s.done ? '✓' : i + 1) + '</span>' +
        '<div><h3>' + esc(m.title) + '</h3><p>' + esc(m.intro) + '</p></div>' +
        '<div class="mod__state"><span>' + m.minutes + ' minutes' + (s.done ? ' · quiz ' + s.score + '/' + m.quiz.length : '') + '</span>' +
        '<a class="btn ' + (s.done ? 'btn--plain' : 'btn--go') + '" href="#' + c.id + '--' + m.id + '">' + (s.done ? 'Go over it again' : 'Start') + '<span class="visually-hidden"> ' + esc(m.title) + '</span></a></div></li>';
    }).join('');
    var n = doneCount(c);
    app.innerHTML = '<h1>' + esc(c.title) + '</h1><p class="lede">' + esc(c.who) + '</p>' +
      '<div class="bar" role="img" aria-label="' + n + ' of ' + c.modules.length + ' modules done"><span style="width:' + Math.round(100 * n / c.modules.length) + '%"></span></div>' +
      '<ol class="modules">' + list + '</ol>' +
      (n === c.modules.length ? '<div class="result"><p class="score">Course complete</p><p>You have finished every module of the ' + esc(c.title) + ' course. Keep the manual to hand: select Help with this page in PHAEMA at any time.</p></div>' : '');
  }

  function player(c, m) {
    crumbs.innerHTML = '<a href="#home">All courses</a> / <a href="#' + c.id + '">' + esc(c.title) + '</a> / ' + esc(m.title);
    var total = m.steps.length, i = 0, seen = {};
    function step() {
      seen[i] = true;
      var s = m.steps[i];
      var box = s.box ? 'left:' + (s.box[0] * 100) + '%;top:' + (s.box[1] * 100) + '%;width:' + (s.box[2] * 100) + '%;height:' + (s.box[3] * 100) + '%' : 'display:none';
      var dots = m.steps.map(function (_, k) {
        return '<button type="button" data-k="' + k + '" class="' + (seen[k] ? 'seen' : '') + '"' + (k === i ? ' aria-current="step"' : '') + ' aria-label="Step ' + (k + 1) + '"></button>';
      }).join('');
      app.innerHTML = '<h1>' + esc(m.title) + '</h1>' +
        '<div class="player"><figure class="shot" style="margin:0"><img src="' + s.img + '" width="1280" height="800" alt="PHAEMA screen: ' + esc(s.title) + '. The highlighted area is described in the step text."><span class="hl pulse" style="' + box + '"></span></figure>' +
        '<section class="panel" aria-live="polite"><p class="phase">Step ' + (i + 1) + ' of ' + total + '</p><h2>' + esc(s.title) + '</h2><p>' + esc(s.text) + '</p>' +
        '<div class="dots" aria-label="Steps">' + dots + '</div>' +
        '<div class="nav"><button class="btn btn--plain" id="prev"' + (i === 0 ? ' disabled' : '') + '>Back</button>' +
        '<button class="btn btn--go" id="next">' + (i === total - 1 ? 'Try it yourself' : 'Next') + '</button></div></section></div>';
      document.getElementById('prev').onclick = function () { if (i > 0) { i--; step(); } };
      document.getElementById('next').onclick = function () { if (i < total - 1) { i++; step(); } else exercise(); };
      Array.prototype.forEach.call(app.querySelectorAll('.dots button'), function (b) { b.onclick = function () { i = +b.dataset.k; step(); }; });
      document.getElementById('next').focus();
    }
    function mcq(name, q, onAnswer) {
      return '<fieldset class="choices"><legend>' + esc(q.q) + '</legend>' + order(q).map(function (k) {
        return '<label class="choice"><input type="radio" name="' + name + '" value="' + k + '"><span>' + esc(q.options[k]) + '</span></label>';
      }).join('') + '</fieldset>';
    }
    function order(q) {  // stable shuffle so the answer is not always first
      var idx = q.options.map(function (_, k) { return k; });
      var seed = q.q.length;
      for (var k = idx.length - 1; k > 0; k--) { seed = (seed * 9301 + 49297) % 233280; var j = seed % (k + 1); var t = idx[k]; idx[k] = idx[j]; idx[j] = t; }
      return idx;
    }
    function mark(name, q, extra) {
      var picked = app.querySelector('input[name="' + name + '"]:checked');
      if (!picked) return null;
      var right = +picked.value === q.answer;
      Array.prototype.forEach.call(app.querySelectorAll('input[name="' + name + '"]'), function (inp) {
        inp.disabled = true;
        var lab = inp.parentNode;
        if (+inp.value === q.answer) lab.classList.add('right'); else if (inp === picked) lab.classList.add('wrong');
      });
      return right;
    }
    function exercise() {
      var e = m.exercise;
      app.innerHTML = '<h1>' + esc(m.title) + '</h1><div class="trythis"><h3>Try it yourself</h3><p>Open the training copy of PHAEMA and find the answer in the demonstration data.</p></div>' +
        '<div class="panel" style="position:static">' + mcq('ex', e) +
        '<p class="hint" id="hintp"><button class="linkbtn" id="hint">Show a hint</button></p><div id="fb" aria-live="polite"></div>' +
        '<div class="nav"><button class="btn btn--plain" id="back">Back to the steps</button><button class="btn btn--go" id="check">Check my answer</button></div></div>';
      document.getElementById('hint').onclick = function () { document.getElementById('hintp').textContent = 'Hint: ' + e.hint; };
      document.getElementById('back').onclick = function () { i = 0; step(); };
      document.getElementById('check').onclick = function () {
        var r = mark('ex', e);
        var fb = document.getElementById('fb');
        if (r === null) { fb.innerHTML = '<p class="feedback no">Choose an answer first.</p>'; return; }
        fb.innerHTML = '<p class="feedback' + (r ? '' : ' no') + '">' + (r ? 'Right. ' : 'Not quite. ') + 'The answer is ' + esc(e.options[e.answer]) + '.</p>';
        var btn = document.getElementById('check'); btn.textContent = 'Go to the quiz'; btn.onclick = quiz; btn.focus();
      };
    }
    function quiz() {
      var qs = m.quiz;
      app.innerHTML = '<h1>Quiz: ' + esc(m.title) + '</h1><p class="lede">' + qs.length + ' questions. You see the answer after each one.</p>' +
        qs.map(function (q, k) { return '<div class="panel" style="position:static;margin-bottom:14px">' + mcq('q' + k, q) + '<div id="fb' + k + '" aria-live="polite"></div><button class="btn btn--plain" data-q="' + k + '">Check</button></div>'; }).join('') +
        '<p id="sum" aria-live="polite"></p><button class="btn btn--go" id="finish" disabled>Finish the module</button>';
      var marks = {};
      Array.prototype.forEach.call(app.querySelectorAll('[data-q]'), function (b) {
        b.onclick = function () {
          var k = +b.dataset.q, q = qs[k], r = mark('q' + k, q);
          var fb = document.getElementById('fb' + k);
          if (r === null) { fb.innerHTML = '<p class="feedback no">Choose an answer first.</p>'; return; }
          marks[k] = r; b.disabled = true;
          fb.innerHTML = '<p class="feedback' + (r ? '' : ' no') + '">' + (r ? 'Right. ' : 'Not quite. ') + esc(q.why) + '</p>';
          var n = Object.keys(marks).length;
          if (n === qs.length) { var f = document.getElementById('finish'); f.disabled = false; document.getElementById('sum').textContent = 'All answered.'; f.focus(); }
        };
      });
      document.getElementById('finish').onclick = function () {
        var score = Object.keys(marks).filter(function (k) { return marks[k]; }).length;
        state[m.id] = { done: true, score: Math.max(score, (state[m.id] && state[m.id].score) || 0) }; save();
        var idx = c.modules.indexOf(m), next = c.modules[idx + 1];
        app.innerHTML = '<div class="result"><p class="phase">' + esc(c.title) + '</p><h1>' + esc(m.title) + ': done</h1><p class="score">' + score + ' / ' + qs.length + '</p>' +
          '<p>' + (score === qs.length ? 'Full marks.' : 'Go over the steps again any time from the course page.') + '</p>' +
          '<div class="nav" style="justify-content:flex-start">' + (next ? '<a class="btn btn--go" href="#' + c.id + '--' + next.id + '">Next: ' + esc(next.title) + '</a>' : '') +
          '<a class="btn btn--plain" href="#' + c.id + '">Back to the course</a></div></div>';
        app.focus();
      };
    }
    step();
  }

  function route() {
    var h = (location.hash || '#home').slice(1), parts = h.split('--'), c = course(parts[0]);
    if (!c) home();
    else if (parts[1]) { var m = c.modules.filter(function (x) { return x.id === parts[1]; })[0]; if (m) player(c, m); else courseView(c); }
    else courseView(c);
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
