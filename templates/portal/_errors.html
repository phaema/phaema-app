{% load i18n %}{% if form.errors %}<div class="govuk-error-summary" data-module="govuk-error-summary"><div role="alert">
<h2 class="govuk-error-summary__title">{% translate "There is a problem" %}</h2>
<div class="govuk-error-summary__body"><ul class="govuk-list govuk-error-summary__list">
{% for e in form.non_field_errors %}<li>{{ e }}</li>{% endfor %}
{% for field in form %}{% for e in field.errors %}<li><a href="#id_{{ field.name }}">{{ e }}</a></li>{% endfor %}{% endfor %}
</ul></div></div></div>{% endif %}
